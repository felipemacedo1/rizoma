name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify with Java ${{ matrix.java }}
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Execute documented quickstart
        if: matrix.java == '21'
        run: ./scripts/quickstart.sh
