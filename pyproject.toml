[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rizoma"
version = "0.1.0"
description = "Motor extensivel para importacao automatizada e mapeamento inteligente de planilhas e CSV."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Felipe Macedo" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
xlsx = ["openpyxl>=3.1"]

[project.scripts]
rizoma = "smart_import_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_import_engine"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
